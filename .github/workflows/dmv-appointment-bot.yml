name: DMV Appointment Bot

on:
  schedule:
    # Run roughly every 5 minutes (GitHub does not guarantee exact timing)
    # Note: Scheduled workflows only run on the default branch (main/master)
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date (YYYY-MM-DD) to alert on/before"
        required: false
        default: ""
      target_window_days:
        description: "Window in days (±) around target_date (e.g., 60 for ±60 days)"
        required: false
        default: "60"
        type: number

jobs:
  run-bot:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    concurrency:
      group: dmv-appointment-bot
      cancel-in-progress: true
    env:
      # Priority: manual input > repo variable DMV_TARGET_DATE > fallback
      DMV_TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || vars.DMV_TARGET_DATE || '' }}
      DMV_TARGET_WINDOW_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_window_days || vars.DMV_TARGET_WINDOW_DAYS || '60' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        # Playwright Docker image already includes Node & browsers.

      - name: Install dependencies
        run: npm ci

      - name: Run DMV appointment bot
        run: npm test

      - name: Analyze results
        id: analyze
        run: |
          if [ ! -f dmv-results.json ]; then
            echo "dmv-results.json not found"
            echo "should_email=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node <<'EOF'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('dmv-results.json', 'utf8'));
          const alerts = data.alerts || [];
          const results = data.results || [];
          const targetDate = data.targetDate || '';
          const windowDays = data.targetWindowDays || 0;
          const generatedAt = data.generatedAt || new Date().toISOString();

          let should = 'false';
          const allRows = results.map((r) => {
            const raw = r.dataVal || '';
            const date = raw.split(' ')[0] || r.dateText || '';
            const time = r.timeText || (raw.split(' ')[1] || '');
            return { loc: r.locationName || 'Unknown', date, time, raw, ok: r.ok, reason: r.reason || '' };
          });

          let textBody = `No alerts within target window (${targetDate} ±${windowDays}d).\n\nAll locations:\n` +
            (allRows.length
              ? allRows.map(r => `- ${r.loc}: ${r.date} ${r.time} (${r.raw || 'n/a'})${r.ok ? '' : ' [no result: ' + r.reason + ']'}`).join('\n')
              : 'No results');

          let htmlBody = `
              <h2>DMV Appointment Results</h2>
              <p>Target window: <strong>${targetDate} ±${windowDays}d</strong></p>
              <h3>All locations (soonest found)</h3>
              <table border="1" cellpadding="6" cellspacing="0" style="border-collapse: collapse;">
                <thead><tr><th>Location</th><th>Date</th><th>Time</th><th>Raw</th><th>Status</th></tr></thead>
                <tbody>
                  ${allRows.length ? allRows.map(r => `<tr><td>${r.loc}</td><td>${r.date}</td><td>${r.time}</td><td>${r.raw}</td><td>${r.ok ? 'OK' : 'No result: ' + r.reason}</td></tr>`).join('') : '<tr><td colspan="5">No results</td></tr>'}
                </tbody>
              </table>
            `;

          if (alerts.length > 0) {
            should = 'true';
            const rows = alerts.map((a) => {
              const raw = a.dataVal || '';
              const date = raw.split(' ')[0] || a.dateText || '';
              const time = a.timeText || (raw.split(' ')[1] || '');
              return { loc: a.locationName || 'Unknown', date, time, raw };
            });
            textBody =
              `Target window: ${targetDate} ±${windowDays}d\n` +
              `Alerts:\n` +
              rows.map((r) => `- ${r.loc}: ${r.date} ${r.time} (${r.raw})`).join('\n') +
              `\n\nAll locations:\n` +
              (allRows.length
                ? allRows.map(r => `- ${r.loc}: ${r.date} ${r.time} (${r.raw || 'n/a'})${r.ok ? '' : ' [no result: ' + r.reason + ']'}`).join('\n')
                : 'No results');

            htmlBody = `
              <h2>DMV Appointment Alerts</h2>
              <p>Target window: <strong>${targetDate} ±${windowDays}d</strong></p>
              <h3>Alerts</h3>
              <table border="1" cellpadding="6" cellspacing="0" style="border-collapse: collapse; margin-bottom:12px;">
                <thead><tr><th>Location</th><th>Date</th><th>Time</th><th>Raw</th></tr></thead>
                <tbody>
                  ${rows.map(r => `<tr><td>${r.loc}</td><td>${r.date}</td><td>${r.time}</td><td>${r.raw}</td></tr>`).join('')}
                </tbody>
              </table>
              <h3>All locations (soonest found)</h3>
              <table border="1" cellpadding="6" cellspacing="0" style="border-collapse: collapse;">
                <thead><tr><th>Location</th><th>Date</th><th>Time</th><th>Raw</th><th>Status</th></tr></thead>
                <tbody>
                  ${allRows.length ? allRows.map(r => `<tr><td>${r.loc}</td><td>${r.date}</td><td>${r.time}</td><td>${r.raw}</td><td>${r.ok ? 'OK' : 'No result: ' + r.reason}</td></tr>`).join('') : '<tr><td colspan="5">No results</td></tr>'}
                </tbody>
              </table>
              <p>Generated at: ${generatedAt}</p>
            `;
          }

          const outFile = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(outFile, `should_email=${should}\n`);
          fs.appendFileSync(outFile, `email_text<<EOF\n${textBody}\nEOF\n`);
          fs.appendFileSync(outFile, `email_html<<EOF\n${htmlBody}\nEOF\n`);
          console.log(`Alerts found: ${alerts.length}`);
          EOF

      # Optional: send an email if any alert matches the target window.
      # Configure SMTP_* and DMV_EMAIL_* as encrypted repo/organization secrets.
      - name: Send email notification
        if: steps.analyze.outputs.should_email == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: DMV appointment alert
          to: ${{ secrets.DMV_EMAIL_TO }}
          from: ${{ secrets.DMV_EMAIL_FROM }}
          secure: true
          html_body: ${{ steps.analyze.outputs.email_html }}
          body: ${{ steps.analyze.outputs.email_text }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
